<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lesotho Community Library mark" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="badgeClip">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
  </defs>

  <!-- outer ring -->
  <circle cx="60" cy="60" r="58" fill="#16233A" />
  <circle cx="60" cy="60" r="56" fill="#F1E9D8" />

  <g clip-path="url(#badgeClip)">
    <!-- Lesotho flag bands: blue / white / green -->
    <rect x="4" y="4" width="112" height="112" fill="#00209F" />
    <rect x="4" y="41.3" width="112" height="37.3" fill="#FFFFFF" />
    <rect x="4" y="78.7" width="112" height="37.3" fill="#009543" />

    <!-- mokorotlo (Basotho hat) silhouette, redrawn simply, centered on the white band -->
    <g transform="translate(60,60)">
      <path d="M -20 12 L 20 12 L 13 -6 Q 0 -20 -13 -6 Z" fill="#16233A" />
      <ellipse cx="0" cy="12" rx="22" ry="4" fill="#16233A" />
      <line x1="0" y1="-20" x2="0" y2="-30" stroke="#16233A" stroke-width="2.4" stroke-linecap="round" />
      <circle cx="0" cy="-32" r="3" fill="#16233A" />
      <!-- woven cross-hatch band at the hat's base, echoing the mokorotlo's braided rim -->
      <path d="M -19 12 L -14 8 M -12 12 L -6 6 M -4 12 L 2 4 M 6 12 L 12 4 M 14 12 L 19 7"
            stroke="#F1E9D8" stroke-width="1.1" stroke-linecap="round" fill="none" />
    </g>

    <!-- open book beneath the hat, standing in for the library -->
    <g transform="translate(60,90)">
      <path d="M -18 -3 Q -9 -8 0 -3 Q 9 -8 18 -3 L 18 4 Q 9 -1 0 4 Q -9 -1 -18 4 Z" fill="#16233A" />
    </g>
  </g>

  <!-- thin brass ring accent -->
  <circle cx="60" cy="60" r="56" fill="none" stroke="#B08A3E" stroke-width="1.5" />
</svg>
